<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Private Insurance scatter — legend selection by size</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding:18px; background:#f7f7f8; color:#111 }
    #vis { box-shadow:0 2px 8px rgba(0,0,0,0.06); background:#fff; padding:12px; border-radius:8px; max-width:980px; margin:12px auto;}
  </style>
</head>
<body>
  <h2 style="text-align:center">Private Health Insurance (%) vs Population — select size from legend</h2>
  <div id="vis"></div>

<script>
(async function(){
  // raw CSV URL you provided
  const url = "https://raw.githubusercontent.com/ajai0033/FIT3179/refs/heads/Week-10-Homework/LGA_Health_population.csv";

  // fetch + parse
  const text = await fetch(url).then(r => {
    if (!r.ok) throw new Error('Failed to fetch CSV: ' + r.status);
    return r.text();
  });

  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
  if (!parsed || !parsed.data) throw new Error('CSV parse failed');

  // helper: clean numeric strings to numbers
  const cleanNum = v => {
    if (v == null) return null;
    const s = String(v).trim();
    if (s === '') return null;
    const cleaned = s.replace(/[^0-9.]/g, '');
    return cleaned === '' ? null : Number(cleaned);
  };

  // compute size categories thresholds — you can tweak thresholds as you like
  // Here we use: Small < 5k, Medium 5k–50k, Large > 50k
  const rowsRaw = parsed.data.map(r => {
    const pop = cleanNum(r['Population (2022)']);
    const insured = cleanNum(r['Persons who reported having private health insurance (no.) (Data year: 2022)']) ?? 0;
    const pct = (pop != null && pop > 0) ? (insured / pop) * 100 : null;
    return {
      lga_name: r['Local Government Areas 2021 name'],
      lga_code: r['Local Government Areas 2021 code'],
      population: pop,
      insured: insured,
      pct_insured: pct
    };
  });

  // filter valid rows and compute bins
  const rows = rowsRaw
    .filter(d => d.population != null && d.population > 0)
    .map(d => {
      let size_cat;
      if (d.population < 5000) size_cat = "Small (<5k)";
      else if (d.population < 50000) size_cat = "Medium (5k–50k)";
      else size_cat = "Large (>50k)";
      return {...d, size_cat};
    });

  // Vega-Lite spec
  const spec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "width": 920,
    "height": 600,
    "description": "Scatter: percent private health insurance vs population with legend-driven selection by size category.",
    "data": {"values": rows},
    // multi selection bound to color encoding (so legend clicks toggle categories)
    "selection": {
      "sizeSel": {
        "type": "multi",
        "encodings": ["color"],
        "on": "click",
        "empty": "all"
      }
    },
    "mark": {"type": "point", "filled": true, "tooltip": true},
    "encoding": {
      "x": {
        "field": "population",
        "type": "quantitative",
        "title": "Population (2022)",
        "scale": {"type": "log", "nice": true}
      },
      "y": {
        "field": "pct_insured",
        "type": "quantitative",
        "title": "Percent with Private Health Insurance (%)",
        "axis": {"format": ".1f"}
      },
      // size still continuous (population) — circle area will vary
      "size": {
        "field": "population",
        "type": "quantitative",
        "legend": {"title": "Population (area)"},
        "scale": {"range": [50, 2500]}
      },
      // color is the categorical size category — legend will show three entries
      "color": {
        "field": "size_cat",
        "type": "nominal",
        "legend": {"title": "Population category"},
        "scale": {"domain":["Small (<5k)","Medium (5k–50k)","Large (>50k)"], "range":["#66c2a5","#fc8d62","#8da0cb"]}
      },
      // opacity depends on selection: selected legend categories show full, others fade
      "opacity": {
        "condition": {"selection": "sizeSel", "value": 1},
        "value": 0.15
      },
      "tooltip": [
        {"field":"lga_name","type":"nominal","title":"LGA"},
        {"field":"lga_code","type":"nominal","title":"LGA code"},
        {"field":"population","type":"quantitative","title":"Population (2022)"},
        {"field":"insured","type":"quantitative","title":"Number insured"},
        {"field":"pct_insured","type":"quantitative","title":"% insured","format":".1f"},
        {"field":"size_cat","type":"nominal","title":"Size category"}
      ]
    }
  };

  // embed
  vegaEmbed('#vis', spec, {actions:false}).then(result => {
    // expose view for debugging/linking if you want
    window.insuranceView = result.view;
  }).catch(err => {
    console.error(err);
    alert("Vega embed error: " + err.message);
  });

})();
</script>
</body>
</html>
