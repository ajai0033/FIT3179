<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Disability rates — bar then map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 18px; background:#f7f7f8; color:#111 }
    .vis { margin: 18px auto; width: 95%; max-width: 1000px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding:12px; border-radius:6px; background:#fff; }
    #status { color:#b33; font-weight:600; margin:8px 0; }
    h1 { margin-bottom:6px; font-size:1.2rem }
    .note { margin-top:0; color:#444; font-size:0.95rem; }
  </style>
</head>
<body>
  <h1>Persons with disability (%) — by LGA (2018)</h1>
  <p class="note">Bar chart (ranked LGAs) appears first. Scroll to see the map below.</p>

  <div id="status" class="vis">Initializing...</div>

  <!-- Bar chart goes first -->
  <div id="barchart" class="vis"></div>

  <!-- Map goes below -->
  <div id="map" class="vis"></div>

<script>
(async function(){
  const statusEl = () => document.getElementById('status');
  function showStatus(msg, isError=false){
    const el = statusEl();
    el.textContent = msg;
    el.style.color = isError ? '#b33' : '#333';
  }

  // ---------- CONFIG: update these if you rename files ----------
  const csvRawUrl = "https://raw.githubusercontent.com/ajai0033/FIT3179/Week-9-Homework/LGA_hlth_disab_DbR_Nov24_-7869466443108774970%20%282%29.csv";
  const topojsonUrl = "https://raw.githubusercontent.com/ajai0033/FIT3179/Week-9-Homework/LGA_2021_AUST_GDA2020.json";
  const topojsonFeature = "LGA_2021_AUST_GDA2020";

  // ---------- 1) Fetch & parse CSV ----------
  showStatus("Fetching CSV...");
  let csvText;
  try {
    const resp = await fetch(csvRawUrl);
    if (!resp.ok) throw new Error(`CSV fetch failed: ${resp.status} ${resp.statusText}`);
    csvText = await resp.text();
    showStatus("CSV fetched. Parsing...");
  } catch (err) {
    console.error(err);
    showStatus("CSV fetch failed: " + err.message, true);
    return;
  }

  let parsed;
  try {
    parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    if (!parsed || !parsed.data) throw new Error("CSV parse returned no data");
    showStatus(`CSV parsed: ${parsed.data.length} rows. Rendering bar chart...`);
  } catch (err) {
    console.error(err);
    showStatus("CSV parse failed: " + err.message, true);
    return;
  }

  // ---------- 2) Prepare rows (convert numeric) ----------
  const rows = parsed.data.map(row => {
    const raw = row["Persons with disability (%) (Data year: 2018)"];
    const num = raw === undefined || raw === null || raw === "" ? null : +String(raw).replace(/,/g,'').trim();
    return {
      lga_name: row["Local Government Areas 2021 name"],
      lga_code: row["Local Government Areas 2021 code"],
      persons_with_disability_pct: isNaN(num) ? null : num,
      __raw: row
    };
  });

  // ---------- 3) Bar chart spec (inline data) ----------
  const barSpec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "title": "LGAs ranked by persons with disability (%) — filterable",
    "width": 900,
    "height": 700,
    "params": [
      {
        "name": "minPct",
        "value": 0,
        "bind": {
          "input": "range",
          "min": 0,
          "max": 40,
          "step": 0.1,
          "name": "Minimum disability % to show: "
        }
      }
    ],
    "data": {"values": rows},
    "transform": [
      {"filter": "datum.persons_with_disability_pct != null && datum.persons_with_disability_pct >= minPct"},
      {"window": [{"op":"rank","as":"rank"}], "sort":[{"field":"persons_with_disability_pct","order":"descending"}]},
      {"filter":"datum.rank <= 100"}
    ],
    "mark": "bar",
    "encoding": {
      "y": {
        "field": "lga_name",
        "type": "ordinal",
        "sort": {"field":"persons_with_disability_pct","order":"descending"},
        "title": "LGA",
        "axis": {"labelLimit": 300, "labelFontSize": 11}
      },
      "x": {
        "field": "persons_with_disability_pct",
        "type": "quantitative",
        "title": "Persons with disability (%) (2018)",
        "axis": {"format": ".1f"}
      },
      "color": {
        "field": "persons_with_disability_pct",
        "type": "quantitative",
        "scale": {"scheme": "blues"},
        "legend": null
      },
      "tooltip": [
        {"field":"lga_name","type":"nominal","title":"LGA"},
        {"field":"lga_code","type":"nominal","title":"LGA code"},
        {"field":"persons_with_disability_pct","type":"quantitative","title":"Pct (2018)","format":".1f"}
      ]
    }
  };

  try {
    await vegaEmbed('#barchart', barSpec, {actions:false});
    showStatus("Bar chart rendered. Now rendering map below...");
  } catch (err) {
    console.error("Bar embed error:", err);
    showStatus("Bar embed failed — see console.", true);
    return;
  }

  // ---------- 4) Render the map (after bar) ----------
  const mapSpec = {
    "$schema":"https://vega.github.io/schema/vega-lite/v5.json",
    "title":"Persons with disability (%) — by LGA (2018) — map",
    "width": 900,
    "height": 600,
    "projection": {"type":"mercator"},
    "data": {
      "url": topojsonUrl,
      "format": {"type":"topojson","feature": topojsonFeature}
    },
    "transform": [
      {
        "lookup": "properties.LGA_CODE21",
        "from": {
          "data": {"values": rows},
          "key": "lga_code",
          "fields": ["persons_with_disability_pct"]
        }
      }
    ],
    "mark": {"type":"geoshape"},
    "encoding": {
      "color": {
        "field": "persons_with_disability_pct",
        "type": "quantitative",
        "scale": {
          "type":"linear",
          "domain": [0,37.2]
        },
        "title":"Persons with disability (%) (2018)"
      },
      "tooltip": [
        {"field":"properties.LGA_NAME21","type":"nominal","title":"LGA"},
        {"field":"persons_with_disability_pct","type":"quantitative","title":"Pct (2018)","format":".1f"}
      ]
    }
  };

  try {
    await vegaEmbed('#map', mapSpec, {actions:false});
    showStatus("Map rendered. Page complete.");
  } catch (err) {
    console.error("Map embed error:", err);
    showStatus("Map embed failed — see console.", true);
    return;
  }

})(); // IIFE
</script>
</body>
</html>
