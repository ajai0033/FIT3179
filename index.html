<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Private Insurance scatter (preprocess JS)</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body>
  <div id="vis"></div>
<script>
(async function(){
  const url = "https://raw.githubusercontent.com/ajai0033/FIT3179/refs/heads/Week-10-Homework/LGA_Health_population.csv";

  // fetch + parse
  const text = await fetch(url).then(r => {
    if (!r.ok) throw new Error('Failed to fetch CSV: ' + r.status);
    return r.text();
  });

  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
  if (!parsed || !parsed.data) throw new Error('CSV parse failed');

  // helper: clean numeric strings to numbers
  const cleanNum = v => {
    if (v == null) return null;
    const s = String(v).trim();
    if (s === '') return null;
    // remove any non-digit or decimal characters (keeps digits and ".")
    const cleaned = s.replace(/[^0-9.]/g, '');
    // guard against empty after cleaning
    return cleaned === '' ? null : Number(cleaned);
  };

  // build cleaned rows
  const rows = parsed.data.map(r => {
    const pop = cleanNum(r['Population (2022)']);
    const insured = cleanNum(r['Persons who reported having private health insurance (no.) (Data year: 2022)']) ?? 0;
    const pct = (pop != null && pop > 0) ? (insured / pop) * 100 : null;
    return {
      lga_name: r['Local Government Areas 2021 name'],
      lga_code: r['Local Government Areas 2021 code'],
      population: pop,
      insured: insured,
      pct_insured: pct
    };
  })
  // optionally filter out rows without population
  .filter(d => d.population != null && d.population > 0);

  // simple vega-lite spec using cleaned rows
  const spec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "width": 900, "height": 600,
    "title": "Private Health Insurance (%) vs Population by LGA (2022)",
    "data": { "values": rows },
    "mark": {"type":"point","filled":true,"tooltip":true},
    "encoding": {
      "x": {"field":"population","type":"quantitative","title":"Population (2022)","scale":{"type":"log","nice":true}},
      "y": {"field":"pct_insured","type":"quantitative","title":"Percent with Private Health Insurance (%)","axis":{"format":".1f"}},
      "size": {"field":"population","type":"quantitative","legend":{"title":"Population size"},"scale":{"range":[50,2500]}},
      "color": {"field":"pct_insured","type":"quantitative","scale":{"scheme":"blues"},"legend":{"title":"% insured"}},
      "tooltip": [
        {"field":"lga_name","type":"nominal","title":"LGA"},
        {"field":"lga_code","type":"nominal","title":"LGA code"},
        {"field":"population","type":"quantitative","title":"Population (2022)"},
        {"field":"insured","type":"quantitative","title":"Number insured"},
        {"field":"pct_insured","type":"quantitative","title":"% insured","format":".1f"}
      ]
    }
  };

  vegaEmbed('#vis', spec, {actions:false});
})();
</script>
</body>
</html>
