<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Persons with disability (%) — by LGA (2018)</title>
  <!-- Vega & Vega-Lite libraries -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h1>Persons with disability (%) — by LGA (2018)</h1>
  <div id="vis"></div>

  <script type="text/javascript">
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "title": "Persons with disability (%) — by LGA (2018)",
      "width": 900,
      "height": 700,
      "projection": {"type": "mercator"},
      "data": {
        "url": "https://raw.githubusercontent.com/ajai0033/FIT3179/Week-9-Homework/LGA_2021_AUST_GDA2020.json",
        "format": {"type": "topojson", "feature": "LGA_2021_AUST_GDA2020"}
      },
      "transform": [
        {
          "lookup": "properties.LGA_CODE21",
          "from": {
            "data": {
              "url": "https://raw.githubusercontent.com/ajai0033/FIT3179/refs/heads/Week-9-Homework/LGA_hlth_disab_DbR_Nov24_-7869466443108774970%20(2).csv"
            },
            "key": "Local Government Areas 2021 code",
            "fields": ["Persons with disability (%) (Data year: 2018)"]
          }
        },
        {
          "calculate": "datum[\"Persons with disability (%) (Data year: 2018)\"] == null ? null : +datum[\"Persons with disability (%) (Data year: 2018)\"]",
          "as": "persons_with_disability_pct"
        }
      ],
      "mark": {"type": "geoshape"},
      "encoding": {
        "color": {
          "field": "persons_with_disability_pct",
          "type": "quantitative",
          "scale": {"type": "quantile"},
          "title": "Persons with disability (%) (2018)"
        },
        "tooltip": [
          {"field": "properties.LGA_NAME21", "type": "nominal", "title": "LGA"},
          {"field": "persons_with_disability_pct", "type": "quantitative", "title": "Pct (2018)"}
        ]
      }
    };

    vegaEmbed('#vis', spec);
  </script>
</body>
</html>
